name: CI

on:
  push:
    branches: [main, frontend, backend]
  pull_request:
    branches: [main]

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Check API imports and models load
        run: python -c "from api.main import app; print('API import OK')"
