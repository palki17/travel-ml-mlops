<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfinder | Travel ML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav">
  <a class="logo" href="#">✈ Wayfinder</a>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="flight" role="tab">Flight price</button>
    <button class="tab" data-tab="gender" role="tab">Gender prediction</button>
    <button class="tab" data-tab="hotel" role="tab">Hotels</button>
  </nav>
</header>

<main class="hero">
  <section class="intro">
    <h1 id="title">Know the fare before you book.</h1>
    <p id="sub">Pick a route and date. Our model estimates the ticket price.</p>
  </section>

  <section class="panel">
    <!-- FLIGHT -->
    <div class="pane active" id="flight">
      <form class="glass form" data-pane="flight">
        <div class="row">
          <label>From<select name="from_city" id="from_city"></select></label>
          <label>To<select name="to" id="to"></select></label>
        </div>
        <div class="row">
          <label>Class<select name="flightType"><option>economic</option><option>premium</option><option>firstClass</option></select></label>
          <label>Agency<select name="agency"><option>FlyingDrops</option><option>CloudFy</option><option>Rainbow</option></select></label>
        </div>
        <button class="cta" type="submit">Predict price</button>
      </form>
      <div class="result" id="out-flight"><p class="empty glass">Your fare estimate will appear here.</p></div>
    </div>

    <!-- GENDER -->
    <div class="pane" id="gender">
      <form class="glass form" data-pane="gender">
        <div class="row">
          <label>Age<input type="number" name="age" min="1" max="100" value="30" required></label>
          <label>Company<select name="company"><option>4You</option><option>Acme Factory</option><option>Monsters CYA</option><option>Umbrella LTDA</option><option>Wonka Company</option></select></label>
        </div>
        <div class="row">
          <label>Number of flights<input type="number" name="n_flights" min="0" value="10" required></label>
          <label>Avg flight price<input type="number" name="avg_flight_price" min="0" step="0.01" value="900" required></label>
        </div>
        <div class="row">
          <label>Avg distance<input type="number" name="avg_distance" min="0" step="0.01" value="500" required></label>
          <label>Number of hotels<input type="number" name="n_hotels" min="0" value="5" required></label>
        </div>
        <div class="row">
          <label>Avg stay (days)<input type="number" name="avg_stay_days" min="0" step="0.01" value="3" required></label>
          <label>Avg hotel total<input type="number" name="avg_hotel_total" min="0" step="0.01" value="800" required></label>
        </div>
        <button class="cta" type="submit">Predict gender</button>
      </form>
      <div class="result" id="out-gender"><p class="empty glass">The prediction will appear here.</p></div>
    </div>

    <!-- HOTEL -->
    <div class="pane" id="hotel">
      <form class="glass form" data-pane="hotel">
        <label>User code<input type="number" name="user_code" min="0" max="1339" value="0" required><small>Valid range: 0 to 1339</small></label>
        <label>How many hotels<input type="number" name="n" min="1" max="10" value="3" required></label>
        <button class="cta" type="submit">Recommend hotels</button>
      </form>
      <div class="result" id="out-hotel"><p class="empty glass">Hotel picks will appear here.</p></div>
    </div>
  </section>
</main>

<footer class="foot">Built with Flask/FastAPI, scikit-learn and MLflow. <span id="mode"></span></footer>
<script src="script.js"></script>
</body>
</html>
